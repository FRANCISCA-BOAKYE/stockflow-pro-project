spring.application.name=stockflow-backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/stockflow
spring.datasource.username=stockflow_user1
spring.datasource.password=stockflow123

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT
jwt.secret=stockflow-super-secret-key-change-this-in-production
jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG